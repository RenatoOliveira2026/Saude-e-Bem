# T-07: checagem obrigatória antes de qualquer coisa entrar em `master`.
# Não usa segredos: o build roda sem variáveis de ambiente (fontes locais,
# Supabase só é consultado em tempo de execução).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar (tipos, lint, build, dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (tsc)
        run: npx tsc --noEmit -p .

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependências sem vulnerabilidade alta ou crítica
        run: npm audit --omit=dev --audit-level=high
